<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pancak - Retro Tape Player</title>
    <meta name="description" content="A premium retro cassette tape music search and player using YouTube APIs.">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="img/favicon.png">
    <!-- Google Fonts: Retro/Modern styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Press+Start+2P&family=VT323&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <!-- Matter.js for physics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <!-- YouTube IFrame API will be loaded dynamically in script.js -->
</head>

<body>
    <div id="physics-container"></div>

    <main class="app-container">
        <header class="header">
            <h1 class="logo">PANCAK <span class="vhs-effect">RD-1985</span></h1>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="SEARCH FOR A TAPE..." autocomplete="off">
                <button id="search-button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8" />
                        <path d="m21 21-4.3-4.3" />
                    </svg>
                </button>
            </div>
        </header>

        <section class="player-section">
            <div id="results-panel" class="results-panel hidden">
                <div class="panel-header">SEARCH RESULTS <button id="close-results">×</button></div>
                <div id="results-list" class="results-list"></div>
            </div>

            <div class="cassette-deck">
                <div class="deck-window">
                    <!-- YouTube Player as a ghostly reflection to bypass all browser throttling -->
                    <div id="youtube-player-container"
                        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.25; pointer-events: none; mix-blend-mode: screen; filter: grayscale(100%) contrast(1.2);">
                        <div id="player"></div>
                    </div>
                    <div class="cassette ejected" id="cassette" style="z-index: 1;">
                        <div class="cassette-body">
                            <div class="label-area">
                                <div class="tape-label">
                                    <div class="label-lines"></div>
                                    <div id="now-playing-title" class="track-title">NO TAPE INSERTED</div>
                                    <div class="side-indicator">SIDE A</div>
                                </div>
                            </div>
                            <div class="reels-container">
                                <div class="reel reel-left" id="reel-left">
                                    <div class="reel-spoke"></div>
                                    <div class="tape-mass" id="tape-mass-left"></div>
                                </div>
                                <div class="reel reel-right" id="reel-right">
                                    <div class="reel-spoke"></div>
                                    <div class="tape-mass" id="tape-mass-right"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="visualizer-container">
                    <canvas id="equalizer-canvas"></canvas>
                </div>

                <div class="controls-panel">
                    <div class="transport-buttons">
                        <button class="btn btn-rect" id="btn-play" title="PLAY">
                            <div class="btn-inner">
                                <div class="icon-play"></div>
                            </div>
                            <span class="btn-label">PLAY</span>
                        </button>
                        <button class="btn btn-rect" id="btn-stop" title="STOP">
                            <div class="btn-inner">
                                <div class="icon-stop"></div>
                            </div>
                            <span class="btn-label">STOP</span>
                        </button>
                        <button class="btn btn-rect" id="btn-prev" title="PREV">
                            <div class="btn-inner">
                                <div class="icon-prev"></div>
                            </div>
                            <span class="btn-label">PREV</span>
                        </button>
                        <button class="btn btn-rect" id="btn-next" title="NEXT">
                            <div class="btn-inner">
                                <div class="icon-next"></div>
                            </div>
                            <span class="btn-label">NEXT</span>
                        </button>
                        <button class="btn btn-rect" id="btn-eject" title="EJECT">
                            <div class="btn-inner">
                                <div class="icon-eject"></div>
                            </div>
                            <span class="btn-label">EJECT</span>
                        </button>
                    </div>

                    <div class="info-displays">
                        <div class="digital-counter" id="timer">00:00</div>
                        <div class="indicator-light" id="status-light"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 PANCAK DIGITAL MASTERING | RD-1985 SERIES</p>
    </footer>

    <script type="module" src="/script.js"></script>
</body>

</html>
